name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: anomalyco/opencode
  UPSTREAM_TAG: v1.19.3
  UPSTREAM_VERSION: "1.19.3"
  OPENTUI_REPO: anomalyco/opentui
  OPENTUI_TAG: v0.4.5
  BUN_PTY_REPO: sursaone/bun-pty
  BUN_PTY_TAG: v0.4.8
  BUN_VERSION: 1.4.3
  ZIG_VERSION: 0.15.2
  NDK_VERSION: 27.2.12479018

jobs:
  native:
    name: native (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            zig_target: aarch64-linux-android
            rust_target: aarch64-linux-android
          - arch: x64
            zig_target: x86_64-linux-android
            rust_target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENTUI_REPO }}
          ref: ${{ env.OPENTUI_TAG }}
          path: opentui

      - name: Patch opentui for Android
        run: git -C opentui apply "$GITHUB_WORKSPACE/self/patches/opentui-build-zig-android.patch"

      - uses: android-actions/setup-android@v3
        with:
          packages: ndk;${{ env.NDK_VERSION }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build libopentui
        working-directory: opentui/packages/core/src/zig
        run: |
          set -euo pipefail
          sysroot="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          triple="${{ matrix.zig_target }}"
          api=28
          test -d "$sysroot/usr/include/$triple"
          test -d "$sysroot/usr/lib/$triple/$api"
          libc_file="$RUNNER_TEMP/android-libc.txt"
          {
            echo "include_dir=$sysroot/usr/include/$triple"
            echo "sys_include_dir=$sysroot/usr/include"
            echo "crt_dir=$sysroot/usr/lib/$triple/$api"
            echo "msvc_lib_dir="
            echo "kernel32_lib_dir="
            echo "gcc_dir="
          } > "$libc_file"
          zig build -Dtarget=$triple -Doptimize=ReleaseFast --libc "$libc_file"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BUN_PTY_REPO }}
          ref: ${{ env.BUN_PTY_TAG }}
          path: bun-pty

      - name: Build librust_pty
        run: |
          set -euo pipefail
          target="${{ matrix.rust_target }}"
          upper=$(echo "$target" | tr 'a-z-' 'A-Z_')
          linker="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/${target}28-clang"
          test -x "$linker"
          export "CARGO_TARGET_${upper}_LINKER=$linker"
          export "CARGO_TARGET_${upper}_RUSTFLAGS=--cfg rustix_use_libc"
          mkdir -p bun-pty/vendor
          cp -r "$GITHUB_WORKSPACE/self/vendor/termios" bun-pty/vendor/termios
          printf '\n[patch.crates-io]\ntermios = { path = "../vendor/termios" }\n' \
            >> bun-pty/rust-pty/Cargo.toml
          cargo build --release --manifest-path bun-pty/rust-pty/Cargo.toml --target "$target"

      - name: Build close_range shim
        run: |
          set -euo pipefail
          mkdir -p native
          cc="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.rust_target }}28-clang"
          test -x "$cc"
          "$cc" -shared -fPIC -O2 -ldl -o native/libtermuxcode-compat.so \
            "$GITHUB_WORKSPACE/self/packaging/close-range-shim.c"
          case "${{ matrix.arch }}" in
            arm64) machine=AArch64 ;;
            x64) machine=X86-64 ;;
          esac
          readelf -h native/libtermuxcode-compat.so | grep -q "Machine:.*$machine"
          nm -D native/libtermuxcode-compat.so | grep -Eq " (close_range|syscall)$"

      - name: Stage libraries
        run: |
          set -euo pipefail
          mkdir -p native
          cp "opentui/packages/core/src/zig/lib/${{ matrix.zig_target }}/libopentui.so" native/
          cp "bun-pty/rust-pty/target/${{ matrix.rust_target }}/release/librust_pty.so" native/
          file native/*.so
          readelf -dW native/libopentui.so | grep NEEDED || true

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: native/*.so
          if-no-files-found: error

  build:
    name: build (${{ matrix.profile }}, ${{ matrix.arch }})
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            arch: arm64
          - profile: full
            arch: x64
          - profile: slim
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream

      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: native

      - name: Load profile
        id: profile
        run: |
          set -euo pipefail
          set -a
          . "$GITHUB_WORKSPACE/self/profiles/${{ matrix.profile }}.env"
          set +a
          echo "suffix=${PACKAGE_VERSION_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Apply android delta
        run: |
          set -euo pipefail
          git -C upstream apply \
            "$GITHUB_WORKSPACE/self/patches/0001-android-build.patch" \
            "$GITHUB_WORKSPACE/self/patches/0002-bundle-metafile.patch"
          if [ "${{ matrix.profile }}" = "slim" ]; then
            git -C upstream apply "$GITHUB_WORKSPACE/self/patches/slim/"*.patch
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: upstream
        run: bun install

      - name: Patch opentui for Android
        run: python3 "$GITHUB_WORKSPACE/self/scripts/patch-opentui.py" upstream

      - name: Build opencode
        working-directory: upstream/packages/opencode
        env:
          OPENCODE_VERSION: ${{ env.UPSTREAM_VERSION }}
          OPENCODE_METAFILE_DIR: ${{ github.workspace }}/metafile
        run: bun run script/build.ts --android

      - name: Upload bundle map
        uses: actions/upload-artifact@v4
        with:
          name: metafile-${{ matrix.profile }}-${{ matrix.arch }}
          path: metafile/opencode-linux-${{ matrix.arch }}-android.json
          if-no-files-found: error

      - name: Package
        run: |
          set -euo pipefail
          version="${UPSTREAM_TAG#v}"
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle/bin" "$bundle/lib/termuxcode"
          install -m755 "$GITHUB_WORKSPACE/self/packaging/termuxcode" "$bundle/bin/termuxcode"
          install -m755 "upstream/packages/opencode/dist/opencode-linux-${{ matrix.arch }}-android/bin/opencode" \
            "$bundle/lib/termuxcode/termuxcode"
          install -m755 native/libopentui.so "$bundle/lib/termuxcode/libopentui.so"
          install -m755 native/librust_pty.so "$bundle/lib/termuxcode/librust_pty.so"
          install -m644 native/libtermuxcode-compat.so "$bundle/lib/termuxcode/libtermuxcode-compat.so"
          bash "$GITHUB_WORKSPACE/self/scripts/package.sh" \
            "${{ matrix.arch }}" "$version" "$bundle" "$GITHUB_WORKSPACE/out" \
            "${{ steps.profile.outputs.suffix }}"
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.profile }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  verify:
    name: verify (${{ matrix.profile }}, ${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: full
            arch: arm64
          - profile: full
            arch: x64
          - profile: slim
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.profile }}-${{ matrix.arch }}
          path: pkg

      - uses: actions/download-artifact@v4
        if: matrix.profile == 'slim'
        with:
          name: package-full-${{ matrix.arch }}
          path: full

      - name: Verify ELF
        run: |
          set -euo pipefail
          mkdir -p extract
          if [ "${{ matrix.profile }}" = "slim" ]; then
            dpkg-deb -x pkg/*.deb extract
            root=extract/data/data/com.termux/files/usr
          else
            tar -xzf pkg/termuxcode-*-${{ matrix.arch }}.tar.gz -C extract
            root=extract
          fi
          bash scripts/verify.sh \
            "$root/lib/termuxcode/termuxcode" \
            "$root/lib/termuxcode/libopentui.so" \
            "${{ matrix.arch }}" \
            "$root/lib/termuxcode/libtermuxcode-compat.so"

      - name: Fetch full bundle map
        if: matrix.profile == 'slim'
        uses: actions/download-artifact@v4
        with:
          name: metafile-full-${{ matrix.arch }}
          path: meta-full

      - name: Check profile metadata
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          version=$(dpkg-deb -f pkg/*.deb Version)
          echo "package version: $version"
          case "${{ matrix.profile }}" in
            full) [ "${version%%+*}" = "$version" ] ;;
            slim) case "$version" in *+slim*) : ;; *) exit 1 ;; esac ;;
          esac

      - name: Fetch bundle map
        uses: actions/download-artifact@v4
        with:
          name: metafile-${{ matrix.profile }}-${{ matrix.arch }}
          path: meta

      - name: Compare with full
        if: matrix.profile == 'slim'
        run: |
          set -euo pipefail
          mkdir -p expected
          tar -xzf full/termuxcode-*-${{ matrix.arch }}.tar.gz -C expected
          slim=extract/data/data/com.termux/files/usr/lib/termuxcode/termuxcode
          full=expected/lib/termuxcode/termuxcode
          slim_js=$(jq '[.outputs[].bytes] | add' meta/*.json)
          full_js=$(jq '[.outputs[].bytes] | add' meta-full/*.json)
          echo "binary slim=$(stat -c %s "$slim") full=$(stat -c %s "$full")"
          echo "bundle slim=$slim_js full=$full_js"
          # The compiled binary is padded and dominated by the Bun runtime, so
          # the bundle map is the honest signal that code was removed.
          [ "$slim_js" -lt "$full_js" ]

      - name: Check bundle map
        run: |
          set -euo pipefail
          file=$(ls meta/*.json)
          count=$(jq '.inputs | length' "$file")
          bytes=$(jq '[.outputs | to_entries[] | .value.bytes] | add' "$file")
          test "$count" -gt 0
          if [ "${{ matrix.profile }}" = "slim" ]; then
            for module in cli/cmd/uninstall.ts cli/cmd/upgrade.ts; do
              if jq -r '.inputs | keys[]' "$file" | grep -q "$module"; then
                echo "module still bundled: $module" >&2
                exit 1
              fi
            done
            jq -r '.inputs | keys[]' "$file" | grep -q 'cli/cmd/tui.ts'
          fi
          echo "modules=$count bytes=$bytes" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd packages
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "termuxcode $GITHUB_REF_NAME" \
            --generate-notes
